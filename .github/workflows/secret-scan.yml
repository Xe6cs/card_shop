# فحص الأسرار على خوادم GitHub عند كل رفع — خط حماية ثانٍ بعد الفحص على جهازك
name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/check-secrets.js --all
